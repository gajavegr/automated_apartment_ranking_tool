[build]
builder = "nixpacks"

[deploy]
startCommand = "gunicorn web_app:app --bind 0.0.0.0:$PORT --timeout 300 --workers 2 --threads 2 --access-logfile - --error-logfile -"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# Health check configuration
healthcheckPath = "/"
healthcheckTimeout = 300

